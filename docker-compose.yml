services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - shoplite
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build:
      context: ./services/user-service
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/shoplite_users
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shoplite
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-service:
    build:
      context: ./services/product-service
    restart: unless-stopped
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/shoplite_products
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shoplite
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build:
      context: ./services/order-service
    restart: unless-stopped
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/shoplite_orders
      JWT_SECRET: ${JWT_SECRET:-}
      PRODUCT_SERVICE_URL: http://product-service:3002
      PRODUCT_SERVICE_TIMEOUT_MS: 5000
    depends_on:
      mongo:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - shoplite
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3003/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - shoplite

volumes:
  mongo-data:

networks:
  shoplite:
    driver: bridge

