apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shoplite
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 3002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shoplite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: product-service
          image: ghcr.io/OWNER/shoplite-product-service:latest
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shoplite-config
                  key: PRODUCT_SERVICE_PORT
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: shoplite-secrets
                  key: PRODUCT_MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shoplite-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
