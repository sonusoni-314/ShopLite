name: Publish order-service image

on:
  push:
    branches:
      - main
    paths:
      - "services/order-service/**"
      - ".github/workflows/publish-order-service.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Order Service image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shoplite-order-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shoplite-order-service:latest

